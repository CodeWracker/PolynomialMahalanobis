[project]
name = "pythonpolinomial"
version = "0.1.0"
description = "Classificador Polinomial Mahalanobis"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "matplotlib",
    "opencv-python",
    "tifffile",
    "imagecodecs",
    "zarr",
    "gdal==3.6.2",
    "threadpoolctl>=3.0",
    "affine",
    "rasterio",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=7.0",
    "pytest-timeout",
    "xxhash",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
